<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookBil - Tjenesten er utilgjengelig</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
    </style>
</head>
<body class="bg-[#0f172a] text-slate-200 min-h-screen flex items-center justify-center p-6">

    <div class="max-w-md w-full bg-[#1e293b] border border-slate-700 rounded-3xl p-8 text-center shadow-2xl">
        
        <div class="mx-auto w-20 h-20 bg-slate-800 rounded-full flex items-center justify-center mb-6 border border-slate-700">
            <span class="material-icons-round text-4xl text-slate-400">directions_car</span>
        </div>
        
        <h1 class="text-2xl font-black text-white mb-4 tracking-tight">
            Tjenesten er stengt
        </h1>
        
        <p class="text-slate-400 text-base leading-relaxed mb-8">
            Applikasjonen BookBil er inntil videre tatt ned etter føringer fra Politidirektoratet (POD).
        </p>
        
        <div class="bg-[#0f172a] rounded-2xl p-5 border border-slate-800">
            <p class="text-sm text-slate-500 font-medium">
                Vennligst benytt tidligere etablerte rutiner for reservasjon av tjenestebil.
            </p>
        </div>

    </div>

</body>
</html>
